<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмінка — Косплей Галерея</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1>Панель адміністратора</h1>
    <a href="index.html" class="btn btn-secondary">← На галерею</a>
  </header>

  <div id="admin-content" class="admin-panel hidden">
    <button class="admin-btn primary" id="btn-albums">Альбоми</button>

    <div id="albums-section" class="albums-section hidden">
      <div>
        <label>Instagram-розмір зображення</label>
        <select id="instagram-size">
          <option value="square">Квадрат 1:1 (1080×1080)</option>
          <option value="portrait">Портрет 4:5 (1080×1350)</option>
          <option value="landscape">Ландшафт 1.91:1 (1080×566)</option>
        </select>
      </div>

      <div>
        <label>Посилання на зображення з Google Диска</label>
        <input type="text" id="drive-url" placeholder="https://drive.google.com/file/d/...">
      </div>

      <button class="admin-btn" id="btn-add-photo">Додати фото до вибраного альбому</button>
      <button class="admin-btn" id="btn-edit">Редагувати</button>
      <button class="admin-btn danger" id="btn-delete">Видалити</button>
    </div>

    <button class="admin-btn" id="btn-publish">Опублікувати</button>
  </div>

  <div id="status" style="margin-top:40px; text-align:center; color:#888;">Перевірка доступу...</div>

  <script type="module" src="js/admin.js?v=1"></script>
</body>
</html>
