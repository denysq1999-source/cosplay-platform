<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмінка — Косплей Галерея</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1 data-i18n="admin_title">Панель адміністратора</h1>
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="lang-switcher">
        <button id="lang-uk" class="lang-btn active">UK</button>
        <span>|</span>
        <button id="lang-en" class="lang-btn">EN</button>
      </div>
      <a href="index.html" class="btn btn-secondary" data-i18n="back_btn">← На галерею</a>
    </div>
  </header>

  <div id="admin-content" class="admin-layout hidden">
    <div class="admin-sidebar">
      <button class="admin-btn primary" id="btn-albums" data-i18n="albums_btn">Альбоми</button>
      <button class="admin-btn" id="btn-background" data-i18n="background_btn">Фон головної</button>
    </div>

    <div class="admin-main">
      <div id="albums-section" class="albums-section hidden">
        <div>
          <label data-i18n="instagram_size_label">Instagram-розмір зображення</label>
          <select id="instagram-size">
            <option value="square" data-i18n="size_square">Квадрат 1:1 (1080×1080)</option>
            <option value="portrait" data-i18n="size_portrait">Портрет 4:5 (1080×1350)</option>
            <option value="landscape" data-i18n="size_landscape">Ландшафт 1.91:1 (1080×566)</option>
          </select>
        </div>

        <div>
          <label data-i18n="drive_url_label">Посилання на зображення з Google Диска</label>
          <input type="text" id="drive-url" data-i18n-placeholder="drive_url_placeholder" placeholder="https://drive.google.com/file/d/...">
        </div>

        <button class="admin-btn" id="btn-add-photo" data-i18n="add_photo_btn">Додати фото до вибраного альбому</button>
        <button class="admin-btn" id="btn-edit" data-i18n="edit_btn">Редагувати</button>
        <button class="admin-btn danger" id="btn-delete" data-i18n="delete_btn">Видалити</button>
        <button class="admin-btn" id="btn-publish" data-i18n="publish_btn">Опублікувати</button>
      </div>

      <div id="background-section" class="albums-section hidden">
        <div style="margin-bottom: 24px;">
          <label data-i18n="bg_guest_label">Фон до входу</label>
          <div id="preview-guest" style="width:100%; height:100px; background:#222; border-radius:8px; margin:8px 0; background-size:cover; background-position:center;"></div>
          <div style="margin-bottom: 8px;">
            <label data-i18n="size_label">Розмір</label>
            <select id="size-guest">
              <option value="w1920" data-i18n="size_full">Full HD (1920)</option>
              <option value="w1280" data-i18n="size_hd">HD (1280)</option>
              <option value="w800" data-i18n="size_medium">Середній (800)</option>
            </select>
          </div>
          <input type="text" id="bg-guest-url" data-i18n-placeholder="drive_url_placeholder" placeholder="https://drive.google.com/file/d/...">
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="admin-btn" id="btn-set-guest" data-i18n="set_btn">Встановити</button>
            <button class="admin-btn danger" id="btn-del-guest" data-i18n="delete_btn">Видалити</button>
          </div>
        </div>

        <div>
          <label data-i18n="bg_user_label">Фон після входу</label>
          <div id="preview-user" style="width:100%; height:100px; background:#222; border-radius:8px; margin:8px 0; background-size:cover; background-position:center;"></div>
          <div style="margin-bottom: 8px;">
            <label data-i18n="size_label">Розмір</label>
            <select id="size-user">
              <option value="w1920" data-i18n="size_full">Full HD (1920)</option>
              <option value="w1280" data-i18n="size_hd">HD (1280)</option>
              <option value="w800" data-i18n="size_medium">Середній (800)</option>
            </select>
          </div>
          <input type="text" id="bg-user-url" data-i18n-placeholder="drive_url_placeholder" placeholder="https://drive.google.com/file/d/...">
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="admin-btn" id="btn-set-user" data-i18n="set_btn">Встановити</button>
            <button class="admin-btn danger" id="btn-del-user" data-i18n="delete_btn">Видалити</button>
          </div>
        </div>

        <div id="bg-status" style="font-size: 13px; margin-top: 12px; color: #aaa;"></div>
      </div>
    </div>
  </div>

  <div id="status" style="margin-top:40px; text-align:center; color:#888;" data-i18n="checking_access">Перевірка доступу...</div>

  <script type="module" src="js/admin.js?v=8"></script>
</body>
</html>
