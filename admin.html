<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмінка — Косплей Галерея</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1 data-i18n="admin_title">Панель адміністратора</h1>
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="lang-switcher">
        <button id="lang-uk" class="lang-btn active">UK</button>
        <span>|</span>
        <button id="lang-en" class="lang-btn">EN</button>
      </div>
      <a href="index.html" class="btn btn-secondary" data-i18n="back_btn">← На галерею</a>
    </div>
  </header>

  <div id="admin-content" class="admin-panel hidden">
    <button class="admin-btn primary" id="btn-albums" data-i18n="albums_btn">Альбоми</button>

    <div id="albums-section" class="albums-section hidden">
      <div>
        <label data-i18n="instagram_size_label">Instagram-розмір зображення</label>
        <select id="instagram-size">
          <option value="square" data-i18n="size_square">Квадрат 1:1 (1080×1080)</option>
          <option value="portrait" data-i18n="size_portrait">Портрет 4:5 (1080×1350)</option>
          <option value="landscape" data-i18n="size_landscape">Ландшафт 1.91:1 (1080×566)</option>
        </select>
      </div>

      <div>
        <label data-i18n="drive_url_label">Посилання на зображення з Google Диска</label>
        <input type="text" id="drive-url" data-i18n-placeholder="drive_url_placeholder" placeholder="https://drive.google.com/file/d/...">
      </div>

      <button class="admin-btn" id="btn-add-photo" data-i18n="add_photo_btn">Додати фото до вибраного альбому</button>
      <button class="admin-btn" id="btn-edit" data-i18n="edit_btn">Редагувати</button>
      <button class="admin-btn danger" id="btn-delete" data-i18n="delete_btn">Видалити</button>
    </div>
  </div>

  <div id="status" style="margin-top:40px; text-align:center; color:#888;" data-i18n="checking_access">Перевірка доступу...</div>

  <script type="module" src="js/admin.js?v=3"></script>
</body>
</html>
