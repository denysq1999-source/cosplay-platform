<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosplay Platform</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; min-height: 100vh; }
        .hidden { display: none !important; }

        /* Нормальна шапка з Flexbox */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header-title { margin: 0; font-size: 24px; }

        /* Блок авторизації тепер частина шапки, без absolute */
        .auth-corner-box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .tabs { display: flex; margin-bottom: 15px; border-bottom: 1px solid #333; }
        .tab { flex: 1; padding: 10px; cursor: pointer; color: #888; background: none; border: none; font-size: 14px; font-weight: bold; }
        .tab.active { color: #fff; border-bottom: 2px solid #4285F4; }

        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button.action-btn { width: 100%; padding: 10px; font-size: 14px; background: #4285F4; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button.action-btn:hover { background: #357ae8; }
        .google-btn { background: #fff; color: #333; margin-top: 10px; font-weight: bold; }
        .google-btn:hover { background: #f1f1f1; }
        .error-msg { color: #d93025; font-size: 12px; margin-bottom: 10px; text-align: center; }

        /* Панель користувача також у шапці */
        .user-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1e1e1e;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logout-btn { background: #d93025; padding: 8px 12px; border-radius: 6px; color: #fff; border: none; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background: #b0271e; }

        /* Контент і Галерея */
        .main-content { width: 100%; max-width: 1000px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .admin-panel { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; display: flex; gap: 10px; box-sizing: border-box; }
        .admin-panel input { margin-bottom: 0; flex: 1; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; width: 100%; }
        .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .card img { width: 100%; height: auto; border-radius: 4px; display: block; }
    </style>
</head>
<body>

    <!-- Єдиний контейнер для шапки -->
    <header class="header-container">
        <h1 class="header-title">Косплей Галерея</h1>

        <!-- Форма авторизації -->
        <div id="auth-section" class="auth-corner-box">
            <div class="tabs">
                <button id="tab-login" class="tab active">Вхід</button>
                <button id="tab-register" class="tab">Реєстрація</button>
            </div>
            <div id="error-container" class="error-msg"></div>

            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit" class="action-btn">Увійти</button>
            </form>

            <form id="register-form" class="hidden">
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Пароль (мін. 6 символів)" required>
                <button type="submit" class="action-btn">Зареєструватися</button>
            </form>

            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
            <button id="google-login-btn" class="action-btn google-btn">Увійти через Google</button>
        </div>

        <!-- Панель користувача (замість форми після входу) -->
        <div id="user-controls" class="user-controls hidden">
            <span id="user-info" style="color: #aaa; font-size: 14px;"></span>
            <button id="logout-btn" class="logout-btn">Вийти</button>
        </div>
    </header>

    <!-- Основний контент (Галерея і адмінка) -->
    <div id="app-section" class="main-content hidden">
        <div class="admin-panel">
            <input type="text" id="image-url-input" placeholder="Вставте посилання на картинку з Google Диска...">
            <button id="add-image-btn" class="action-btn" style="width: auto; margin-top: 0;">Додати в галерею</button>
        </div>
        <div id="gallery" class="gallery">Галерея завантажується...</div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
