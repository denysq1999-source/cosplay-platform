<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Косплей Галерея</title>
  <link rel="stylesheet" href="css/style.css?v=5">
  <style>
    #album-preview {
      display:none;
      width:min(100% - 40px,1120px);
      margin:26px auto 34px;
    }
    .album-shelf {
      display:flex;
      flex-direction:row;
      flex-wrap:wrap;
      align-items:flex-start;
      justify-content:flex-start;
      gap:24px;
      padding:10px 4px 18px;
    }
    .album-card {
      --album-ratio:4 / 5;
      position:relative;
      isolation:isolate;
      display:block;
      flex:0 0 auto;
      width:clamp(150px,18vw,210px);
      aspect-ratio:var(--album-ratio);
      overflow:visible;
      padding:0;
      border:0;
      border-radius:4px 10px 10px 4px;
      color:#fff;
      text-decoration:none;
      background:linear-gradient(90deg,#261a29 0%,#50344e 3%,#17121c 8%,#33213a 100%);
      box-shadow:5px 8px 0 rgba(0,0,0,.28),0 16px 34px rgba(0,0,0,.42);
      transform:perspective(900px) rotateY(-4deg);
      transform-origin:left center;
      transition:transform .28s ease,box-shadow .28s ease,filter .28s ease;
    }
    .album-card::before {
      content:"";
      position:absolute;
      z-index:2;
      top:0;bottom:0;left:0;
      width:9px;
      border-radius:4px 0 0 4px;
      background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(255,255,255,.18),rgba(0,0,0,.12));
      pointer-events:none;
    }
    .album-card::after {
      content:"";
      position:absolute;
      z-index:-1;
      top:5px;bottom:-5px;right:-6px;
      width:8px;
      border-radius:0 5px 5px 0;
      background:repeating-linear-gradient(180deg,#e9e1d8 0 2px,#b9aeb7 2px 3px);
      box-shadow:3px 5px 8px rgba(0,0,0,.2);
    }
    .album-card:hover {
      transform:perspective(900px) rotateY(0) translateY(-6px);
      box-shadow:7px 13px 0 rgba(0,0,0,.25),0 22px 42px rgba(0,0,0,.48);
      filter:brightness(1.06);
    }
    .album-card img {
      position:absolute;
      inset:0;
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
      padding-left:7px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:4px 9px 9px 4px;
      background:linear-gradient(145deg,#352338,#17121c);
    }
    .album-card:focus-visible {
      outline:2px solid #f3a8c3;
      outline-offset:6px;
    }
    @media (max-width:600px) {
      #album-preview { width:calc(100% - 24px); margin:18px auto 24px; }
      .album-shelf { gap:18px; }
      .album-card { width:clamp(138px,39vw,180px); }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1 data-i18n="site_title">Косплей Галерея</h1>

    <div style="display:flex; align-items:center; gap:16px;">
      <div class="lang-switcher" data-lang="uk">
        <button id="lang-uk" class="lang-btn active">UK</button>
        <button id="lang-en" class="lang-btn">EN</button>
      </div>

      <div id="guest-controls" style="display:flex; gap:10px;">
        <button id="btn-login" class="btn btn-secondary" data-i18n="login_btn">Вхід</button>
        <button id="btn-register" class="btn btn-secondary" data-i18n="register_btn">Реєстрація</button>
        <button id="btn-google" class="btn btn-google" data-i18n="google_btn">Увійти через Google</button>
      </div>

      <div id="user-controls" class="hidden" style="display:flex; gap:10px;">
        <a href="profile.html" class="btn btn-secondary" data-i18n="profile_btn">Кабінет</a>
        <a id="btn-admin" href="admin.html" class="btn btn-primary btn-admin-glass" data-i18n="admin_btn">Адмінка</a>
        <button id="btn-logout" class="btn btn-danger" data-i18n="logout_btn">Вийти</button>
      </div>
    </div>
  </header>

  <!-- Auth modal -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h2 id="modal-title" style="margin:0 0 15px; text-align:center; font-size:18px;">Вхід</h2>
      <div id="error-container" class="error-msg"></div>
      <form id="auth-form">
        <input type="email" id="auth-email" data-i18n-placeholder="email_placeholder" placeholder="Email" required>
        <input type="password" id="auth-password" data-i18n-placeholder="password_placeholder" placeholder="Пароль" required>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#aaa; margin: 4px 0 12px; cursor:pointer;">
          <input type="checkbox" id="remember-password" style="width:auto; margin:0;">
          <span data-i18n="remember_password">Запам’ятати пароль</span>
        </label>
        <button type="submit" id="auth-submit-btn" class="action-btn">Увійти</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden">
    <section id="album-preview" aria-label="Альбоми">
      <div class="album-shelf">
        <a class="album-card" id="album-card" href="album.html" aria-label="Відкрити журнал">
          <img id="album-cover" src="" alt="Обкладинка журналу">
        </a>
      </div>
    </section>
    <div id="gallery" class="gallery"></div>
  </div>

  <script type="module" src="js/app.js?v=31"></script>
</body>
</html>
