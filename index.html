<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Косплей Галерея</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #album-preview {
      display: none;
      margin: 30px auto;
      max-width: 280px;
      cursor: pointer;
      text-align: center;
    }
    #album-preview img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      transition: transform .2s;
    }
    #album-preview:hover img { transform: scale(1.03); }
    #album-preview h3 { margin: 10px 0 0; font-size: 16px; }

    #flipbook-modal {
      position: fixed; inset: 0; background: rgba(10,6,14,.92);
      z-index: 100; display: none; align-items: center; justify-content: center;
      flex-direction: column;
    }
    #flipbook-modal.open { display: flex; }
    .book-spread {
      display: flex; width: 800px; height: 520px; background: #fbf6ee;
      border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden;
    }
    .book-page { width: 50%; height: 100%; padding: 20px; color: #2b2230; display: flex; flex-direction: column; }
    .book-page img { width: 100%; height: 340px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; }
    .flip-nav { margin-top: 16px; display: flex; gap: 12px; }
    .close-flip { position: absolute; top: 20px; right: 24px; background: rgba(255,255,255,.1); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; }
  </style>
</head>
<body>

  <header class="header">
    <h1 data-i18n="site_title">Косплей Галерея</h1>

    <div style="display:flex; align-items:center; gap:16px;">
      <div class="lang-switcher" data-lang="uk">
        <button id="lang-uk" class="lang-btn active">UK</button>
        <button id="lang-en" class="lang-btn">EN</button>
      </div>

      <div id="guest-controls" style="display:flex; gap:10px;">
        <button id="btn-login" class="btn btn-secondary" data-i18n="login_btn">Вхід</button>
        <button id="btn-register" class="btn btn-secondary" data-i18n="register_btn">Реєстрація</button>
        <button id="btn-google" class="btn btn-google" data-i18n="google_btn">Увійти через Google</button>
      </div>

      <div id="user-controls" class="hidden" style="display:flex; gap:10px;">
        <a href="profile.html" class="btn btn-secondary" data-i18n="profile_btn">Кабінет</a>
        <a id="btn-admin" href="admin.html" class="btn btn-primary" data-i18n="admin_btn">Адмінка</a>
        <button id="btn-logout" class="btn btn-danger" data-i18n="logout_btn">Вийти</button>
      </div>
    </div>
  </header>

  <!-- Auth modal -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h2 id="modal-title" style="margin:0 0 15px; text-align:center; font-size:18px;">Вхід</h2>
      <div id="error-container" class="error-msg"></div>
      <form id="auth-form">
        <input type="email" id="auth-email" data-i18n-placeholder="email_placeholder" placeholder="Email" required>
        <input type="password" id="auth-password" data-i18n-placeholder="password_placeholder" placeholder="Пароль" required>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#aaa; margin: 4px 0 12px; cursor:pointer;">
          <input type="checkbox" id="remember-password" style="width:auto; margin:0;">
          <span data-i18n="remember_password">Запам’ятати пароль</span>
        </label>
        <button type="submit" id="auth-submit-btn" class="action-btn">Увійти</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden">
    <div id="album-preview">
      <img id="album-cover" src="" alt="Альбом">
      <h3 id="album-preview-title">Альбом</h3>
    </div>
    <div id="gallery" class="gallery"></div>
  </div>

  <!-- Flipbook modal -->
  <div id="flipbook-modal">
    <button class="close-flip" id="close-flip">&times;</button>
    <div class="book-spread">
      <div class="book-page" id="flip-left"></div>
      <div class="book-page" id="flip-right"></div>
    </div>
    <div class="flip-nav">
      <button class="btn" id="flip-prev">‹ Попередня</button>
      <span id="flip-label" style="color:#aaa; align-self:center;"></span>
      <button class="btn" id="flip-next">Наступна ›</button>
    </div>
  </div>

  <script type="module" src="js/app.js?v=26"></script>
</body>
</html>
