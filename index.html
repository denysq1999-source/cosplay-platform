<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosplay Platform</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; padding: 10px; }
        .card img { width: 100%; height: auto; border-radius: 4px; display: block; }
    </style>
</head>
<body>

    <h1>Косплей Галерея</h1>
    
    <!-- Сюди за допомогою JS виводитимуться наші картинки з Диска -->
    <div id="gallery" class="gallery"></div>

    <script src="app.js"></script>
</body>
</html>
