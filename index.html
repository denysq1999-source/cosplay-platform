<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Косплей Галерея</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <style>
    #album-preview {
      display: none;
      width: min(100% - 40px, 1120px);
      margin: 26px auto 30px;
      cursor: pointer;
    }
    .album-shelf {
      display: flex;
      align-items: stretch;
      gap: 18px;
      overflow-x: auto;
      padding: 8px 4px 16px;
      scrollbar-width: thin;
    }
    .album-card {
      flex: 0 0 260px;
      display: grid;
      grid-template-columns: 88px minmax(0,1fr);
      align-items: center;
      gap: 14px;
      min-height: 126px;
      padding: 12px;
      color: #f8edf5;
      text-align: left;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(76,43,75,.94), rgba(31,23,39,.96));
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .album-card:hover {
      transform: translateY(-3px);
      border-color: rgba(243,168,195,.7);
      box-shadow: 0 15px 34px rgba(0,0,0,.3);
    }
    .album-card img {
      display: block;
      width: 88px;
      height: 100px;
      object-fit: contain;
      background: rgba(255,255,255,.07);
      border-radius: 9px;
    }
    .album-card-copy { min-width: 0; }
    .album-card-copy strong {
      display: block;
      overflow-wrap: anywhere;
      font: 600 17px/1.25 Georgia,serif;
    }
    .album-card-copy span {
      display: block;
      margin-top: 7px;
      color: #cbb9cc;
      font-size: 12px;
    }
    @media (max-width:600px) {
      #album-preview { width: calc(100% - 24px); margin: 18px auto 22px; }
      .album-shelf { gap: 12px; }
      .album-card { flex-basis: 230px; grid-template-columns: 76px minmax(0,1fr); min-height: 112px; }
      .album-card img { width: 76px; height: 88px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1 data-i18n="site_title">Косплей Галерея</h1>

    <div style="display:flex; align-items:center; gap:16px;">
      <div class="lang-switcher" data-lang="uk">
        <button id="lang-uk" class="lang-btn active">UK</button>
        <button id="lang-en" class="lang-btn">EN</button>
      </div>

      <div id="guest-controls" style="display:flex; gap:10px;">
        <button id="btn-login" class="btn btn-secondary" data-i18n="login_btn">Вхід</button>
        <button id="btn-register" class="btn btn-secondary" data-i18n="register_btn">Реєстрація</button>
        <button id="btn-google" class="btn btn-google" data-i18n="google_btn">Увійти через Google</button>
      </div>

      <div id="user-controls" class="hidden" style="display:flex; gap:10px;">
        <a href="profile.html" class="btn btn-secondary" data-i18n="profile_btn">Кабінет</a>
        <a id="btn-admin" href="admin.html" class="btn btn-primary btn-admin-glass" data-i18n="admin_btn">Адмінка</a>
        <button id="btn-logout" class="btn btn-danger" data-i18n="logout_btn">Вийти</button>
      </div>
    </div>
  </header>

  <!-- Auth modal -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h2 id="modal-title" style="margin:0 0 15px; text-align:center; font-size:18px;">Вхід</h2>
      <div id="error-container" class="error-msg"></div>
      <form id="auth-form">
        <input type="email" id="auth-email" data-i18n-placeholder="email_placeholder" placeholder="Email" required>
        <input type="password" id="auth-password" data-i18n-placeholder="password_placeholder" placeholder="Пароль" required>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#aaa; margin: 4px 0 12px; cursor:pointer;">
          <input type="checkbox" id="remember-password" style="width:auto; margin:0;">
          <span data-i18n="remember_password">Запам’ятати пароль</span>
        </label>
        <button type="submit" id="auth-submit-btn" class="action-btn">Увійти</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden">
    <section id="album-preview" aria-label="Альбоми">
      <div class="album-shelf">
        <a class="album-card" id="album-card" href="album.html">
          <img id="album-cover" src="" alt="">
          <span class="album-card-copy">
            <strong id="album-preview-title">Альбом</strong>
            <span id="album-preview-count">Відкрити книжковий альбом →</span>
          </span>
        </a>
      </div>
    </section>
    <div id="gallery" class="gallery"></div>
  </div>

  <script type="module" src="js/app.js?v=30"></script>
</body>
</html>
