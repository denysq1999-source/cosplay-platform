<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал косплеєра</title>
<style>
  :root{
    --ink:#2b2230; --paper:#fbf6ee; --paper-2:#f3ebdd;
    --sakura:#f3a8c3; --wine:#3a1630; --gold:#d8b46a;
    --pw:420px; --ph:571px; --shift:0px;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    display:flex; flex-direction:column; overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:#f6eef3; background:#150f1c;
  }
  button{ font:inherit; color:inherit; }

  /* ---------- верхня панель ---------- */
  .top{
    position:relative;z-index:10;display:flex;align-items:center;justify-content:flex-end;
    min-height:58px;padding:10px 20px;
    background:linear-gradient(180deg,rgba(12,8,17,.72),rgba(12,8,17,.12));
  }
  .top-actions{
    display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end;
    padding:4px;border:1px solid rgba(255,255,255,.08);border-radius:999px;
    background:rgba(32,22,39,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .lang-switcher{display:flex;gap:3px;padding:3px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px)}
  .lang-btn{height:30px;min-width:38px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:#d8cbdc;font-size:12px;font-weight:700;cursor:pointer;transition:background-color .28s ease,color .28s ease}
  .lang-btn.active{background:rgba(243,168,195,.24);color:#fff;border:1px solid rgba(243,168,195,.65)}
  .lang-btn:focus-visible{outline:2px solid var(--sakura);outline-offset:2px}
  .back-cover-art,.front-cover-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 30% 20%,#5b2349,var(--wine) 60%,#220c1d)}
  .back-cover-art img,.front-cover-art img{display:block;width:100%;height:100%;object-fit:contain}
  .front-cover-art{background:#24101f}
  .front-cover-art img{object-fit:contain}
  .face.cover.has-cover-art::after,.face.cover.has-cover-art::before{display:none}
  .back-cover-empty{position:absolute;inset:8%;border:2px solid rgba(216,180,106,.65);display:flex;align-items:center;justify-content:center;color:#e6cf9b;font:600 1.5em Georgia,serif;text-align:center;padding:10%}
  .iconbtn{
    height:40px; min-width:40px; padding:0 12px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:background-color .34s cubic-bezier(.2,.75,.25,1), border-color .34s ease,
      color .34s ease, box-shadow .34s ease, transform .2s cubic-bezier(.2,.75,.25,1);
  }
  .iconbtn:hover{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.32); }
  .iconbtn:active{ transform:scale(.96); }
  .iconbtn:disabled{ opacity:.35; cursor:default; transform:none; }
  .iconbtn:focus-visible, .chip:focus-visible, .tag:focus-visible, .like:focus-visible {
    outline:2px solid var(--sakura); outline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce) {
    .iconbtn, .chip, .tag, .like, .corner { transition-duration:.01ms !important; }
  }
  .iconbtn:focus-visible, .chip:focus-visible, .like:focus-visible, .lb button:focus-visible{ outline:2px solid var(--sakura); outline-offset:3px; }

  /* ---------- фільтр за тегами ---------- */
  .tagbar{
    position:relative; z-index:2; display:flex; align-items:center; gap:8px;
    width:100%; padding:8px 16px; overflow-x:auto; overscroll-behavior-x:contain;
    scrollbar-width:none;
  }
  .tagbar[hidden]{ display:none; }
  .tagbar::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none; height:32px; padding:0 14px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); color:#e8dcee; transition:background-color .34s ease, border-color .34s ease, color .34s ease, transform .2s ease;
  }
  .chip:hover{ border-color:rgba(255,255,255,.34); }
  .chip[aria-pressed="true"]{ background:rgba(243,168,195,.22); border-color:var(--sakura); color:#ffe3ee; }

  /* ---------- стіл і книга ---------- */
  .stage{
    position:relative;flex:1;min-height:0;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 78% at 50% 45%,rgba(197,145,117,.12),transparent 72%),
      radial-gradient(ellipse 90% 110% at 50% 50%,rgba(255,255,255,.025),transparent 70%),
      linear-gradient(145deg,#211720 0%,#17101b 56%,#100b15 100%);
  }
  /* Дерев'яна поверхня стенда під журналом */
  .stage::before{
    content:"";position:absolute;inset:16px 3.3%;border:1px solid rgba(232,195,151,.34);
    border-radius:22px;pointer-events:none;
    background:
      radial-gradient(ellipse 26% 32% at 18% 22%,rgba(224,174,124,.10),transparent 75%),
      radial-gradient(ellipse 34% 30% at 78% 76%,rgba(12,5,3,.16),transparent 75%),
      repeating-linear-gradient(2deg,transparent 0 23px,rgba(255,224,184,.035) 24px,rgba(28,12,7,.12) 27px,transparent 31px 48px),
      repeating-linear-gradient(178deg,rgba(0,0,0,.055) 0 1px,transparent 1px 8px),
      linear-gradient(112deg,#65432f 0%,#4b3027 22%,#765039 48%,#45291f 73%,#68452f 100%);
    box-shadow:
      0 18px 44px rgba(0,0,0,.34),
      inset 0 1px 0 rgba(255,245,226,.22),
      inset 0 -15px 25px rgba(12,5,3,.24),
      inset 0 0 0 7px rgba(22,10,7,.15),
      inset 0 0 0 8px rgba(236,201,160,.13);
  }
  /* Ледь помітне скло: відблиски, тонкий кант і м'який глянець */
  .stage::after{
    content:"";position:absolute;inset:16px 3.3%;border:1px solid rgba(255,240,219,.19);
    border-radius:22px;pointer-events:none;
    background:
      linear-gradient(122deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,.045) 13%,transparent 31%,transparent 66%,rgba(255,255,255,.035) 81%,rgba(255,255,255,.09) 100%),
      radial-gradient(ellipse 34% 18% at 50% 0%,rgba(255,245,229,.10),transparent 85%),
      linear-gradient(180deg,rgba(255,255,255,.025),transparent 34%,transparent 78%,rgba(0,0,0,.10));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 0 32px rgba(255,244,226,.035);
    backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);
  }
  @media(max-width:640px){
    .stage::before,.stage::after{inset:8px 2%;border-radius:15px;}
  }
  .book{
    position:absolute; z-index:1; left:50%; top:50%;
    width:calc(var(--pw) * 2); height:var(--ph);
    margin-left:calc(var(--pw) * -1 + var(--shift));
    margin-top:calc(var(--ph) / -2);
    perspective:2600px;
    touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab;
  }
  .book.grabbing{ cursor:grabbing; }
  .book::before{                       /* тінь книги на столі */
    content:""; position:absolute; left:2%; right:2%; bottom:-22px; height:40px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 70%); filter:blur(8px); pointer-events:none;
  }
  .leaf{
    position:absolute; left:50%; top:0; width:var(--pw); height:100%;
    transform-origin:left center; transform-style:preserve-3d;
  }
  .face{
    position:absolute; inset:0; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background-color:var(--paper);
    background-image:radial-gradient(rgba(110,80,50,.05) 1px, transparent 1.2px);
    background-size:6px 6px;
    color:var(--ink);
    font-size:calc(var(--pw) * .034);
    box-shadow:0 1px 2px rgba(0,0,0,.3);
    transition:box-shadow .15s;
  }
  .face.back{ transform:rotateY(180deg); }
  .leaf.lift .face{ box-shadow:0 20px 46px rgba(0,0,0,.5); }
  .face::before{                         /* тінь у корінці книги */
    content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
    background:linear-gradient(to right, rgba(40,20,20,.30), rgba(40,20,20,0) 15%);
  }
  .face.back::before{ background:linear-gradient(to left, rgba(40,20,20,.30), rgba(40,20,20,0) 15%); }
  .shade{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:4; }

  /* сторінка з фото */
  .sheet{ position:absolute; inset:0; padding:5.5% 7% 5%; display:flex; flex-direction:column; }
  .photo{
    position:relative; flex:0 0 auto; align-self:center;
    width:var(--photo-width,86%); height:var(--photo-height,60%);
    max-width:90%; max-height:72%; min-width:0; min-height:0;
    aspect-ratio:var(--photo-ratio, 4 / 5);
    margin:0 0 4.5%; padding:0;
    overflow:hidden; background:#fff; border:1px solid rgba(255,255,255,.9);
    cursor:zoom-in; box-shadow:0 .3em 1em rgba(60,30,40,.24);
    transform:none;
  }
  .photo img, .ph{
    width:100%; height:100%; display:block; object-fit:contain;
    background:transparent; border:0;
  }
  .ph{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4em; color:rgba(255,255,255,.92);
    background:linear-gradient(150deg, var(--g1), var(--g2));
  }
  .ph b{ font:600 5.2em/1 "Palatino Linotype","Book Antiqua",Georgia,serif; opacity:.9; }
  .ph small{ font-size:.9em; opacity:.75; }
  .tape{ position:absolute; width:22%; height:6%; background:rgba(243,168,195,.55); box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .tape.t1{ top:-3%; left:-5%; transform:rotate(-38deg); }
  .tape.t2{ top:-3%; right:-5%; transform:rotate(38deg); }
  .cap h3{ margin:0; font:600 1.75em/1.15 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif; }
  .cap .series{ margin:.15em 0 0; font-style:italic; color:#6d5d72; }
  .cap .by{ margin:.1em 0 0; font-size:.92em; color:#8a7a8f; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:.6em; margin-top:.7em; }
  .tags{ display:flex; flex-wrap:wrap; gap:.4em; }
  .tag{
    padding:.2em .7em; border-radius:999px; font-size:.85em; cursor:pointer; border:1px solid #d8c9d6; background:#fff7fb; color:#6a4a62;
  }
  .tag:hover{ background:#ffe9f2; border-color:var(--sakura); color:#57334d; }
  .like{
    flex:none; display:inline-flex; align-items:center; gap:.4em; padding:.35em .85em; border-radius:999px; cursor:pointer;
    border:1px solid #e0c9d6; background:#fff; color:#a2557a; font-weight:700; transition:transform .2s ease, background-color .34s ease, border-color .34s ease, color .34s ease, box-shadow .34s ease;
  }
  .like:hover{ background:#fff0f6; border-color:#f3a8c3; box-shadow:0 4px 12px rgba(162,85,122,.14); }
  .like:active{ transform:scale(.94); }
  .like[aria-pressed="true"]{ background:#f3a8c3; border-color:#f3a8c3; color:#fff; }
  .pno{ position:absolute; bottom:1.2%; font-size:.8em; color:#a898ad; }
  .face.front .pno{ right:6%; }  .face.back .pno{ left:6%; }

  /* Декор на верхніх кутах фоторамки */
  .corner{
    position:absolute;bottom:0;width:7%;aspect-ratio:1;z-index:2;
    pointer-events:none;transition:width .28s ease;
  }
  .face.front .corner{right:0;background:linear-gradient(315deg,#cdbfa8 0 50%,transparent 50%);box-shadow:-2px -2px 6px rgba(0,0,0,.18);}
  .face.back .corner{left:0;background:linear-gradient(45deg,#cdbfa8 0 50%,transparent 50%);box-shadow:2px -2px 6px rgba(0,0,0,.18);}

  .photo-corner{
    position:absolute;top:0;z-index:3;width:clamp(26px,8.5%,42px);height:clamp(26px,8.5%,42px);
    display:grid;place-items:center;pointer-events:none;line-height:1;
    transition:color .2s ease,background-color .2s ease,filter .2s ease;
  }
  .photo-corner.left{left:0;}
  .photo-corner.right{right:0;}
  .book[data-corner-style="classic"] .photo-corner{
    background:var(--corner-color,#cdbfa8);
    box-shadow:0 1px 4px rgba(0,0,0,.18);
  }
  .book[data-corner-style="classic"] .photo-corner.left{clip-path:polygon(0 0,100% 0,0 100%);}
  .book[data-corner-style="classic"] .photo-corner.right{clip-path:polygon(0 0,100% 0,100% 100%);}
  .book[data-corner-style="star"] .photo-corner,
  .book[data-corner-style="flower"] .photo-corner{
    background:none;color:var(--corner-color,#e7b85c);
    font-size:clamp(20px,2.8vw,34px);text-shadow:0 2px 5px rgba(0,0,0,.28);
  }
  .book[data-corner-style="star"] .photo-corner::before{content:"★";}
  .book[data-corner-style="flower"] .photo-corner::before{content:"✿";}
  .book[data-corner-style="bookmark"] .photo-corner{
    width:clamp(19px,5.5%,27px);height:clamp(34px,9%,46px);
    background:var(--corner-color,#e7b85c);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
  }
  .book[data-corner-enabled="false"] .photo-corner{display:none;}


  /* обкладинка, вступ, кінець */
  .face.cover{ background:radial-gradient(120% 90% at 30% 20%, #5b2349, var(--wine) 60%, #220c1d); color:#f3dfb2; background-image:none; }
  .face.cover::after{ content:""; position:absolute; inset:4.5%; border:2px solid rgba(216,180,106,.65); border-radius:4px; pointer-events:none; }
  .face.cover::before{ background:linear-gradient(to right, rgba(0,0,0,.4), rgba(0,0,0,0) 12%); }
  .face.cover.back::before{ background:linear-gradient(to left, rgba(0,0,0,.4), rgba(0,0,0,0) 12%); }
  .cv{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:14%; gap:.9em; }
  .cv h2{ margin:0; font:600 2.4em/1.15 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif; text-shadow:0 1px 0 rgba(0,0,0,.4); }
  .cv .rule{ width:34%; height:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  .cv p{ margin:0; font-size:1.05em; color:#e6cf9b; }
  .face.back.cover{background:#24101f;background-image:none}
  .face.back.cover::after{display:none}
  .face.back.cover::before{display:none}
  .page-note{ position:absolute; inset:0; padding:10% 9%; display:flex; flex-direction:column; gap:.7em; }
  .page-note h3{ margin:0; font:600 1.9em/1.15 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif; }
  .page-note p{ margin:0; line-height:1.55; color:#5b4b60; }
  .page-note ul{ margin:.2em 0 0; padding-left:1.1em; color:#5b4b60; line-height:1.6; }
  .page-note.center{ align-items:center; justify-content:center; text-align:center; }
  .page-note.intro-page{ padding:8% 9%; overflow:hidden; }
  .intro-copy{ flex:0 0 auto; min-width:0; }
  .intro-art{ flex:1 1 auto; min-height:0; width:100%; margin-top:.7em; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .intro-art img{ display:block; width:100%; height:100%; max-width:100%; max-height:100%; object-fit:contain; border-radius:4px; box-shadow:0 5px 16px rgba(65,45,55,.18); }

  /* ---------- навігація журналом ---------- */
  .ctrl{
    display:flex;align-items:center;justify-content:center;gap:18px;
    min-height:66px;padding:8px 18px 12px;
    background:linear-gradient(180deg,rgba(22,15,29,.15),rgba(12,8,17,.72));
  }
  .ctrl .iconbtn{
    width:42px;height:42px;min-width:42px;padding:0;
    border-color:rgba(255,255,255,.13);
    background:rgba(255,255,255,.055);
    color:#f4dce8;font-size:23px;
  }
  .ctrl .iconbtn:hover{background:rgba(243,168,195,.15);border-color:rgba(243,168,195,.42);}
  .ctrl span{
    min-width:150px;text-align:center;font-size:13px;
    letter-spacing:.02em;color:#d8c9dc;
  }
  @media(max-width:640px){
    .ctrl{min-height:58px;gap:12px;padding:6px 12px 10px;}
    .ctrl .iconbtn{width:38px;height:38px;min-width:38px;}
    .ctrl span{min-width:112px;font-size:12px;}
  }

  /* ---------- перегляд на весь екран ---------- */
  .lb{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(10,6,14,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .lb[hidden]{ display:none; }
  .lb-card{ display:flex; flex-direction:column; gap:12px; max-width:min(92vw,1000px); max-height:94vh; }
  .lb-img{ max-height:72vh; min-height:200px; min-width:min(80vw,420px); display:flex; justify-content:center; }
  .lb-img img{ max-width:100%; max-height:72vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .lb-img .ph{ width:min(70vw,420px); aspect-ratio:3/4; height:auto; border-radius:6px; font-size:16px; }
  .lb-cap{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .lb-cap h3{ margin:0; font:600 22px/1.2 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif; }
  .lb-cap p{ margin:2px 0 0; color:#bfb2c6; font-size:14px; }
  .lb .like{ font-size:15px; }
  .lb-nav{ position:absolute; top:50%; transform:translateY(-50%); }
  .lb-nav.prev{ left:18px; } .lb-nav.next{ right:18px; }
  .lb-close{ position:absolute; top:16px; right:18px; }

  @media (max-width:640px){
    .top p{ display:none; }
    .ctrl span{ min-width:120px; font-size:13px; }
  }
  @media (prefers-reduced-motion: reduce){
    .face, .iconbtn, .chip, .like, .corner{ transition:none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-actions">
    <div class="lang-switcher" role="group" aria-label="Language">
      <button class="lang-btn" id="lang-uk" type="button" aria-pressed="false">UK</button>
      <button class="lang-btn" id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
    <a class="iconbtn" id="gallery-link" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none">← На галерею</a>
    <button class="iconbtn" id="snd" type="button" aria-pressed="true" aria-label="Звук гортання" title="Звук гортання">🔊</button>
  </div>
</header>

<nav class="tagbar" id="tags" aria-label="Фільтр за тегами" hidden></nav>

<main class="stage" id="stage">
  <div class="book" id="book" aria-label="Відкритий журнал"></div>
</main>

<footer class="ctrl">
  <button class="iconbtn" id="prev" type="button" aria-label="Попередня сторінка">‹</button>
  <span id="label" aria-live="polite"></span>
  <button class="iconbtn" id="next" type="button" aria-label="Наступна сторінка">›</button>
</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Фото на весь екран">
  <button class="iconbtn lb-close" id="lbClose" type="button" aria-label="Закрити">✕</button>
  <button class="iconbtn lb-nav prev" id="lbPrev" type="button" aria-label="Попереднє фото">‹</button>
  <div class="lb-card">
    <div class="lb-img" id="lbImg"></div>
    <div class="lb-cap">
      <div><h3 id="lbTitle"></h3><p id="lbMeta"></p></div>
      <button class="like" id="lbLike" type="button" aria-pressed="false">♥ <span></span></button>
    </div>
  </div>
  <button class="iconbtn lb-nav next" id="lbNext" type="button" aria-label="Наступне фото">›</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnS9-bQngWjNxM1rKz_qRbrQopSd1aAqA",
  authDomain: "cosplay-platform.firebaseapp.com",
  projectId: "cosplay-platform",
  storageBucket: "cosplay-platform.firebasestorage.app",
  messagingSenderId: "524210919675",
  appId: "1:524210919675:web:929740053092247656f85e"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

/* =====================================================================
   НАЛАШТУВАННЯ: тут міняєш назву альбому та додаєш свої фото
   ---------------------------------------------------------------------
   src      — посилання на фото (шлях на сайті або повна адреса).
              Порожній src показує кольорову заглушку з літерою.
   tags     — теги персонажа/серії; за ними працює фільтр зверху.
   likes    — стартова кількість лайків.
   ===================================================================== */
let ALBUM = { title: 'Альбом косплеєра', owner: 'Нікнейм косплеєра', year: '2026', pageFormat: '4:5', cornerStyle: 'classic', cornerColor: '#cdbfa8', cornerDecorEnabled: true };

let PHOTOS = [];

const LS_LIKES = 'cosplay:album:likes:v1';
const LS_SOUND = 'cosplay:album:sound:v1';
function readLocalValue(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function writeLocalValue(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}
try { localStorage.removeItem('savedCredentials'); } catch {}
function readStoredLikes() {
  try {
    const value = JSON.parse(readLocalValue(LS_LIKES) || '[]');
    return Array.isArray(value) ? value.filter(id => typeof id === 'string') : [];
  } catch {
    return [];
  }
}

/* ===================== ЧИСТА ЛОГІКА (її перевіряють тести) ===================== */
//#pure-start
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const toDeg = r => r * 180 / Math.PI;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// Тягнемо праву сторінку вліво: від точки захвату (кут 0) до лівого краю книги (кут 180).
function angleForward(grabX, x, farX) {
  const t = clamp((grabX - x) / Math.max(1, grabX - farX), 0, 1);
  return toDeg(Math.acos(1 - 2 * t));
}
// Тягнемо ліву сторінку вправо: від 180 до 0.
function angleBackward(grabX, x, farX) {
  const t = clamp((x - grabX) / Math.max(1, farX - grabX), 0, 1);
  return 180 - toDeg(Math.acos(1 - 2 * t));
}
// Зсув книги: закрита обкладинка по центру, відкрита книга по центру, задня обкладинка по центру.
function shiftFor(p, N, pw) {
  const a = clamp(p, 0, 1), b = clamp(p - (N - 1), 0, 1);
  return -pw / 2 * (1 - a) + pw / 2 * b;
}
const zFor = (i, cur, N) => i < cur ? i : N - i;

// Сторінки книги: обкладинка, вступ, фото, (порожня для парності), кінець, задня обкладинка.
function buildFaces(photos) {
  const faces = [{ kind: 'cover' }, { kind: 'intro' }];
  photos.forEach(p => faces.push({ kind: 'photo', photo: p }));
  if ((photos.length + 4) % 2 === 1) faces.push({ kind: 'blank' });
  faces.push({ kind: 'end' }, { kind: 'back' });
  return faces;
}
function pageLabel(cur, N) {
  if (cur === 0) return tr('cover');
  if (cur === N) return tr('backCover');
  return tr('pages') + ' ' + (2 * cur - 1) + '–' + (2 * cur);
}
function visiblePhotos(all, tag) { return tag ? all.filter(p => p.tags.includes(tag)) : all; }
function topTags(all, max) {
  const n = new Map();
  all.forEach(p => p.tags.forEach(t => n.set(t, (n.get(t) || 0) + 1)));
  return [...n.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'uk')).slice(0, max).map(e => e[0]);
}
const esc = (v = '') => String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function safeSrc(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  const driveId = s.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (s.includes('drive.google.com') && driveId) {
    return `https://drive.google.com/thumbnail?id=${driveId[1]}&sz=w1200`;
  }
  return /^(https?:\/\/|\/(?!\/)|\.\/|\.\.\/|[\w-]+\/(?!\/)|data:image\/)/.test(s) ? s : '';
}
//#pure-end

let busy = false, drag = null, tag = '';

$('lang-en').addEventListener('click', () => setLanguage('en'));

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const likeCount = p => p.likes + (likes.has(p.id) ? 1 : 0);
const photoById = id => PHOTOS.find(p => p.id === id);
const hue = i => (i * 47 + 330) % 360;

/* Calculate each photo frame from the real page space and source image ratio. */
function syncPhotoFrames() {
  if (!book) return;
  book.querySelectorAll('.photo').forEach(frame => {
    const sheet = frame.closest('.sheet');
    if (!sheet) return;
    const img = frame.querySelector('img');
    const ratio = img && img.naturalWidth > 0 && img.naturalHeight > 0
      ? img.naturalWidth / img.naturalHeight
      : 4 / 5;
    const sheetStyle = getComputedStyle(sheet);
    const innerWidth = Math.max(1,
      sheet.clientWidth - parseFloat(sheetStyle.paddingLeft) - parseFloat(sheetStyle.paddingRight));
    const innerHeight = Math.max(1,
      sheet.clientHeight - parseFloat(sheetStyle.paddingTop) - parseFloat(sheetStyle.paddingBottom));
    const caption = sheet.querySelector('.cap');
    const captionHeight = caption ? caption.getBoundingClientRect().height : innerHeight * .25;
    const bottomGap = sheet.clientHeight * .045;
    const maxWidth = innerWidth * .90;
    const maxHeight = Math.max(56, innerHeight - captionHeight - bottomGap - 8);
    const width = Math.max(1, Math.min(maxWidth, maxHeight * ratio));
    const height = width / ratio;
    frame.style.width = width.toFixed(1) + 'px';
    frame.style.height = height.toFixed(1) + 'px';
    frame.style.setProperty('--photo-ratio', ratio.toFixed(5));
  });
}

/* ===================== РЕНДЕР СТОРІНОК ===================== */
function photoFace(p, side, faceIndex) {
  const i = PHOTOS.indexOf(p);
  const media = safeSrc(p.src)
    ? `<img src="${esc(safeSrc(p.src))}" alt="${esc(p.title)}" draggable="false" decoding="async" style="object-fit:contain">`
    : `<div class="ph" style="--g1:hsl(${hue(i)} 52% 42%);--g2:hsl(${hue(i) + 40} 55% 28%)"><b>${esc(p.title.slice(0, 1))}</b><small>${tr('addPhoto')}</small></div>`;
  return `<div class="sheet" data-photo="${esc(p.id)}">
    <div class="photo" data-open="${esc(p.id)}">${media}<i class="photo-corner left"></i><i class="photo-corner right"></i></div>
    <div class="cap"><h3>${esc(p.title)}</h3><p class="series">${esc(p.series)}</p><p class="by">${tr('cosplayer')} ${esc(p.cosplayer)}</p>
      <div class="row"><div class="tags">${p.tags.map(t => `<button class="tag" type="button" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <button class="like" type="button" data-like="${esc(p.id)}" aria-pressed="false">♥ <span>${likeCount(p)}</span></button></div></div>
    <span class="pno">${faceIndex}</span></div>`;
}
function faceHTML(f, faceIndex) {
  switch (f.kind) {
    case 'cover': {
      const cover = safeSrc(ALBUM.coverImage);
      return cover
        ? `<div class="front-cover-art"><img src="${esc(cover)}" alt="Обкладинка журналу" draggable="false"></div>`
        : `<div class="cv"><h2>${esc(ALBUM.title)}</h2><div class="rule"></div><p>${esc(ALBUM.owner)}</p><p>${esc(ALBUM.year)}</p></div><i class="corner"></i>`;
    }
    case 'intro': {
      const t = topTags(PHOTOS, 12);
      const introImage = safeSrc(ALBUM.introImage);
      return `<div class="page-note intro-page">
        <div class="intro-copy">
          <h3>${tr('about')}</h3>
          <p>${tr('aboutText')}</p>
          <ul><li>${tr('drag')}</li><li>${tr('zoom')}</li><li>${tr('filter')}</li></ul>
          <p>${tr('total')} <b>${PHOTOS.length}</b>. ${tr('tags')} ${t.map(esc).join(', ')}.</p>
        </div>
        ${introImage ? `<div class="intro-art"><img src="${esc(introImage)}" alt="Зображення першої сторінки" loading="lazy"></div>` : ''}
      </div><span class="pno">${faceIndex}</span>`;
    }
    case 'photo': return photoFace(f.photo, faceIndex % 2 ? 'l' : 'r', faceIndex);
    case 'blank':
      return `<div class="page-note center"><p>${tr('blank')}</p></div><span class="pno">${faceIndex}</span><i class="corner"></i>`;
    case 'end':
      return `<div class="page-note center"><h3>${tr('thanks')}</h3><p>${tr('more')}</p></div><span class="pno">${faceIndex}</span>`;
    default: // back cover
      const backCover = safeSrc(ALBUM.backCoverImage);
      return backCover
        ? `<div class="back-cover-art"><img src="${esc(backCover)}" alt="Back cover" draggable="false"></div>`
        : `<div class="cv back-cover-empty"><div class="rule"></div><p>${esc(ALBUM.owner)}</p></div>`;
  }
}

function build() {
  const allowedCornerStyles = ['classic','star','bookmark','flower'];
  const cornerStyle = allowedCornerStyles.includes(ALBUM.cornerStyle) ? ALBUM.cornerStyle : 'classic';
  const cornerColor = /^#[0-9a-fA-F]{6}$/.test(ALBUM.cornerColor || '') ? ALBUM.cornerColor : '#cdbfa8';
  book.dataset.cornerStyle = cornerStyle;
  book.dataset.cornerEnabled = ALBUM.cornerDecorEnabled === false ? 'false' : 'true';
  book.style.setProperty('--corner-color', cornerColor);
  faces = buildFaces(visiblePhotos(PHOTOS, tag));
  N = faces.length / 2; cur = 0; busy = false;
  book.innerHTML = '';
  leaves = faces.reduce((acc, _, i) => {
    if (i % 2) return acc;
    const front = faces[i], back = faces[i + 1];
    const el = document.createElement('div');
    el.className = 'leaf';
    el.innerHTML =
      `<div class="face front ${front.kind === 'cover' ? 'cover' : ''} ${front.kind === 'cover' && safeSrc(ALBUM.coverImage) ? 'has-cover-art' : ''}">${faceHTML(front, i)}<div class="shade"></div></div>` +
      `<div class="face back ${back.kind === 'back' ? 'cover' : ''}">${faceHTML(back, i + 1)}<div class="shade"></div></div>`;
    book.appendChild(el); acc.push(el); return acc;
  }, []);
  syncPhotoFrames();
  book.querySelectorAll('.photo img').forEach(img => {
    if (!img.complete) img.addEventListener('load', syncPhotoFrames, { once: true });
  });
  refreshLikes(); layout(); updateUI();
}

/* ===================== ПОЛОЖЕННЯ АРКУШІВ ===================== */
function applyAngle(i, a) {
  const l = leaves[i], s = Math.sin(a * Math.PI / 180);
  l.style.transform = `rotateY(${-a}deg)`;
  const sh = l.querySelectorAll('.shade');
  sh[0].style.opacity = (s * .5).toFixed(3);
  sh[1].style.opacity = (s * .5).toFixed(3);
  l.classList.toggle('lift', a > 2 && a < 178);
}
function setShift(p) { book.style.setProperty('--shift', shiftFor(p, N, PW).toFixed(1) + 'px'); }
function layout() {
  leaves.forEach((l, i) => { l.style.zIndex = zFor(i, cur, N); applyAngle(i, i < cur ? 180 : 0); });
  setShift(cur);
}
function updateUI() {
  const label = pageLabel(cur, N);
  $('label').textContent = label;
  $('prev').disabled = cur <= 0; $('next').disabled = cur >= N;
}

/* ===================== АНІМАЦІЯ ===================== */
function tween(idx, from, to, dur, ease, done) {
  busy = true; leaves[idx].style.zIndex = 1000;
  const t0 = performance.now(), d = reduceMotion ? 1 : dur;
  (function f(now) {
    const k = Math.min(1, (now - t0) / d), a = from + (to - from) * ease(k);
    applyAngle(idx, a);
    if (k < 1) requestAnimationFrame(f); else { busy = false; done && done(); }
  })(t0);
}
function flip(dir) {
  if (busy) return;
  if (dir > 0 && cur < N) { const i = cur; swish(1); tween(i, 0, 180, 850, easeInOut, () => { cur++; layout(); updateUI(); thud(.8); }); }
  else if (dir < 0 && cur > 0) { const i = cur - 1; swish(1); tween(i, 180, 0, 850, easeInOut, () => { cur--; layout(); updateUI(); thud(.8); }); }
}

/* ===================== ГОРТАННЯ МИШКОЮ ===================== */
book.addEventListener('pointerdown', e => {
  if (busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const r = book.getBoundingClientRect(), spineX = r.left + r.width / 2, pw = r.width / 2;
  const side = e.clientX >= spineX ? 'r' : 'l';
  drag = { side, x0: e.clientX, y0: e.clientY, spineX, pw, moved: false, a: side === 'r' ? 0 : 180,
           idx: side === 'r' ? cur : cur - 1, target: e.target, hist: [{ x: e.clientX, t: performance.now() }] };
  if (drag.idx < 0 || drag.idx >= N) { drag = null; return; }
  book.setPointerCapture(e.pointerId); ensureAudio();
});
book.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true; book.classList.add('grabbing'); swish(.8);
  }
  const far = drag.side === 'r' ? drag.spineX - drag.pw : drag.spineX + drag.pw;
  drag.a = drag.side === 'r' ? angleForward(drag.x0, e.clientX, far) : angleBackward(drag.x0, e.clientX, far);
  applyAngle(drag.idx, drag.a);
  drag.hist.push({ x: e.clientX, t: performance.now() }); if (drag.hist.length > 5) drag.hist.shift();
});
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null; book.classList.remove('grabbing');
  if (!d.moved) { if (!cancelled) handleClick(d, e); return; }
  const h = d.hist, v = h.length > 1 ? (h[h.length - 1].x - h[0].x) / Math.max(1, h[h.length - 1].t - h[0].t) : 0;
  let complete = d.side === 'r' ? (d.a > 90 || v < -.45) : (d.a < 90 || v > .45);
  if (cancelled) complete = false;
  const target = d.side === 'r' ? (complete ? 180 : 0) : (complete ? 0 : 180);
  const dur = 220 + Math.abs(target - d.a) / 180 * 420;
  tween(d.idx, d.a, target, dur, easeOut, () => {
    if (complete) { cur += d.side === 'r' ? 1 : -1; thud(.7); }
    layout(); updateUI();
  });
}
book.addEventListener('pointerup', e => endDrag(e, false));
book.addEventListener('pointercancel', e => endDrag(e, true));

book.addEventListener('click', e => {
  if (e.detail !== 0) return;               // detail 0 = натиснули Enter/Space на кнопці
  handleClick({ target: e.target, spineX: 0, pw: 1, side: 'r' }, { clientX: 0 });
});

function handleClick(d, e) {
  const t = d.target;
  const like = t.closest && t.closest('[data-like]');
  if (like) { toggleLike(like.dataset.like); return; }
  const tg = t.closest && t.closest('[data-tag]');
  if (tg) { setTag(tg.dataset.tag); return; }
  const ph = t.closest && t.closest('[data-open]');
  if (ph) { openLB(ph.dataset.open); return; }
  // клік по зовнішньому краю сторінки гортає її
  const x = (e.clientX - (d.spineX - d.pw * (d.side === 'r' ? 0 : 1))) / d.pw;
  const edge = d.side === 'r' ? x > .82 : x < .18;
  if (edge) flip(d.side === 'r' ? 1 : -1);
}

$('next').onclick = () => flip(1);
$('prev').onclick = () => flip(-1);
addEventListener('keydown', e => {
  if (!$('lb').hidden) {
    if (e.key === 'Escape') closeLB(); else if (e.key === 'ArrowRight') stepLB(1); else if (e.key === 'ArrowLeft') stepLB(-1);
    return;
  }
  if (e.key === 'ArrowRight') flip(1); else if (e.key === 'ArrowLeft') flip(-1);
});

/* ===================== ТЕГИ ===================== */
function renderTags() {
  const bar = $('tags');
  const tags = topTags(PHOTOS, 10);
  bar.replaceChildren();
  bar.hidden = tags.length === 0;
  ['', ...tags].forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = t || tr('all');
    b.setAttribute('aria-pressed', String(t === tag));
    b.onclick = () => setTag(t);
    bar.appendChild(b);
  });
}
function setTag(t) { tag = (t === tag) ? '' : t; renderTags(); build(); fit(); }

/* ===================== ЛАЙКИ ===================== */
function refreshLikes() {
  document.querySelectorAll('[data-like]').forEach(b => {
    const p = photoById(b.dataset.like); if (!p) return;
    b.setAttribute('aria-pressed', String(likes.has(p.id)));
    b.querySelector('span').textContent = likeCount(p);
  });
}
function toggleLike(id) {
  likes.has(id) ? likes.delete(id) : likes.add(id);
  writeLocalValue(LS_LIKES, JSON.stringify([...likes]));
  refreshLikes();
}
$('lbLike').onclick = () => lbId && toggleLike(lbId);

/* ===================== ПЕРЕГЛЯД НА ВЕСЬ ЕКРАН ===================== */
let lbId = null;
function openLB(id) {
  const list = visiblePhotos(PHOTOS, tag), p = list.find(x => x.id === id) || photoById(id);
  if (!p) return;
  lbId = p.id;
  const i = PHOTOS.indexOf(p);
  $('lbImg').innerHTML = safeSrc(p.src)
    ? `<img src="${esc(safeSrc(p.src))}" alt="${esc(p.title)}">`
    : `<div class="ph" style="--g1:hsl(${hue(i)} 52% 42%);--g2:hsl(${hue(i) + 40} 55% 28%)"><b>${esc(p.title.slice(0, 1))}</b><small>Додай фото в PHOTOS</small></div>`;
  $('lbTitle').textContent = p.title;
  $('lbMeta').textContent = p.series + ' · косплеєр ' + p.cosplayer;
  $('lbLike').dataset.like = p.id;
  $('lb').hidden = false;
  refreshLikes();
}
function closeLB() { $('lb').hidden = true; lbId = null; }
function stepLB(d) {
  const list = visiblePhotos(PHOTOS, tag), i = list.findIndex(x => x.id === lbId);
  if (i < 0 || !list.length) return;
  openLB(list[(i + d + list.length) % list.length].id);
}
$('lbClose').onclick = closeLB;
$('lbNext').onclick = () => stepLB(1);
$('lbPrev').onclick = () => stepLB(-1);
$('lb').addEventListener('click', e => { if (e.target === $('lb')) closeLB(); });

/* ===================== ЗВУК ГОРТАННЯ ЖУРНАЛУ ===================== */
/* Звук створюється в браузері: шелест глянцевого паперу з легким тріском і глухий «ляпас», коли сторінка лягає.
   Хочеш справжній запис — поклади mp3 поруч і впиши шлях у SOUND_FILE (наприклад 'sounds/page-turn.mp3'). */
const SOUND_FILE = '';
let ctx = null, bufRustle = null, bufThud = null, bufFile = null;
function makeBuffers() {
  const sr = ctx.sampleRate;
  const n = Math.floor(sr * .55); bufRustle = ctx.createBuffer(1, n, sr);
  const d = bufRustle.getChannelData(0); let lp = 0;
  for (let i = 0; i < n; i++) {
    const t = i / n, env = Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.15)), 1.4) * (1 - t * .35);
    const crack = Math.random() < .035 ? (Math.random() * 2 - 1) * 1.6 : 0;   // глянцевий папір тріщить
    lp += ((Math.random() * 2 - 1) - lp) * .55;                              // трохи притлумлений шум
    d[i] = (lp * .55 + crack) * env;
  }
  const m = Math.floor(sr * .14); bufThud = ctx.createBuffer(1, m, sr);
  const e = bufThud.getChannelData(0);
  for (let i = 0; i < m; i++) e[i] = ((Math.random() * 2 - 1) * .5 + Math.sin(i / sr * 2 * Math.PI * 95) * .8) * Math.pow(1 - i / m, 3);
}
function ensureAudio() {
  if (ctx || !soundOn) return;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    makeBuffers();
    if (SOUND_FILE) fetch(SOUND_FILE).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)).then(buf => { bufFile = buf; }).catch(() => {});
  } catch { ctx = null; }
}
function play(buf, gain, rate, filterType, f0, f1) {
  if (!soundOn) return; ensureAudio(); if (!ctx || !buf) return;
  if (ctx.state === 'suspended') ctx.resume();
  const t = ctx.currentTime, src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
  const f = ctx.createBiquadFilter(); f.type = filterType; f.Q.value = .7;
  f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + buf.duration / rate);
  const g = ctx.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t);
}
function swish(power) { ensureAudio(); play(bufFile || bufRustle, (bufFile ? .6 : .3) * power, bufFile ? 1 : .8 + Math.random() * .25, 'bandpass', 4200, 1600); }
function thud(power) { ensureAudio(); if (!bufFile) play(bufThud, .5 * power, .95 + Math.random() * .1, 'lowpass', 500); }
function paintSound() { const b = $('snd'); b.textContent = soundOn ? '🔊' : '🔈'; b.setAttribute('aria-pressed', String(soundOn)); }
  $('snd').onclick = () => { soundOn = !soundOn; writeLocalValue(LS_SOUND, soundOn ? '1' : '0'); paintSound(); };

/* ===================== РОЗМІР ПІД ЕКРАН ===================== */
function fit() {
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  const [rw, rh] = (ALBUM.pageFormat || '4:5').split(':').map(Number);
  const pageRatio = rw > 0 && rh > 0 ? rw / rh : 4 / 5; // page width / page height
  // Give wide 16:9 pages more room while keeping the complete spread inside the stage.
  PW = Math.round(clamp(Math.min((w - 56) / 2, (h - 34) * pageRatio, 600), 100, 600));
  PH = Math.round(PW / pageRatio);
  const root = document.documentElement.style;
  root.setProperty('--pw', PW + 'px'); root.setProperty('--ph', PH + 'px');
  if (leaves.length) { syncPhotoFrames(); layout(); }
}
addEventListener('resize', fit);

/* ===================== ЗАВАНТАЖЕННЯ АЛЬБОМУ З FIRESTORE ===================== */
async function loadAlbum() {
  let loadFailed = false;
  try {
    const requestedId = new URLSearchParams(location.search).get('id');
    let snap;
    if (requestedId) {
      if (requestedId === 'legacy') {
        const migratedLegacy = await getDoc(doc(db, 'settings', 'album_legacy'));
        snap = migratedLegacy.exists()
          ? migratedLegacy
          : await getDoc(doc(db, 'settings', 'album'));
      } else {
        snap = await getDoc(doc(db, 'settings', `album_${requestedId}`));
      }
    } else {
      const settingsSnap = await getDocs(collection(db, 'settings'));
      const magazineDocs = settingsSnap.docs
        .filter(item => item.id.startsWith('album_'))
        .sort((a, b) => a.id.localeCompare(b.id));
      snap = magazineDocs.length
        ? magazineDocs[0]
        : await getDoc(doc(db, 'settings', 'album'));
    }
    if (snap.exists()) {
      const data = snap.data() || {};
      ALBUM = {
        title: data.title || 'Альбом косплеєра',
        owner: data.owner || data.cosplayer || 'Косплеєр',
        year: data.year || '2026',
        pageFormat: ['4:5','3:4','2:3','1:1','16:9'].includes(data.pageFormat) ? data.pageFormat : '4:5',
        coverImage: data.coverImage || data.introImage || data.firstPageImage || '',
        backCoverImage: data.backCoverImage || data.backCover || '',
        cornerStyle: ['classic','star','bookmark','flower'].includes(data.cornerStyle) ? data.cornerStyle : 'classic',
        cornerColor: /^#[0-9a-fA-F]{6}$/.test(data.cornerColor || '') ? data.cornerColor : '#cdbfa8',
        cornerDecorEnabled: data.cornerDecorEnabled !== false
      };
      PHOTOS = Array.isArray(data.pages) ? data.pages
        .filter(p => p && typeof p === 'object')
        .map((p, i) => ({
          id: String(p.id || `photo-${i + 1}`),
          title: String(p.title || 'Без назви'),
          series: String(p.series || ''),
          cosplayer: String(p.cosplayer || '—'),
          tags: Array.isArray(p.tags) ? p.tags.map(String).filter(Boolean) : [],
          likes: Number.isFinite(Number(p.likes)) ? Math.max(0, Number(p.likes)) : 0,
          src: String(p.src || p.url || p.imageUrl || p.image || '')
        })) : [];
    } else {
      console.warn('Запитаний журнал не знайдено у Firestore.');
      loadFailed = true;
      PHOTOS = [];
    }
  } catch (error) {
    console.error('Не вдалося завантажити альбом з Firestore:', error);
    loadFailed = true;
  }

  document.title = ALBUM.title || 'Журнал косплеєра';
  paintSound();
  applyLanguage();
  renderTags();
  fit();
  build();
  fit();
  if (loadFailed) $('label').textContent = tr('loadError');
}

loadAlbum();
</script>
