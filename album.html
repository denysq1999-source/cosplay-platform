<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Альбом</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #150f1c; color: #f6eef3; margin: 0; font-family: system-ui, sans-serif; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
  .stage { height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; }
  .book-container { width: 90%; max-width: 900px; height: 80%; background: #1a1224; border-radius: 16px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: auto; }
  .page-card { background: #fbf6ee; color: #2b2230; border-radius: 8px; padding: 16px; margin: 12px 0; display: flex; gap: 16px; }
  .page-card img { width: 180px; height: 240px; object-fit: cover; border-radius: 4px; }
  .ctrl { display: flex; justify-content: center; gap: 16px; padding: 16px; }
</style>
</head>
<body>

<header class="header">
  <h1 id="albumTitle" style="margin:0; font-size:22px;">Альбом косплеєра</h1>
  <a href="index.html" class="btn btn-secondary">← На галерею</a>
</header>

<div class="stage">
  <div class="book-container" id="book"></div>
</div>

<footer class="ctrl">
  <button class="btn" id="prev">‹ Попередня</button>
  <span id="label" style="align-self:center; color:#aaa;"></span>
  <button class="btn" id="next">Наступна ›</button>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnS9-bQngWjNxM1rKz_qRbrQopSd1aAqA",
  authDomain: "cosplay-platform.firebaseapp.com",
  projectId: "cosplay-platform",
  storageBucket: "cosplay-platform.firebasestorage.app",
  messagingSenderId: "524210919675",
  appId: "1:524210919675:web:929740053092247656f85e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pages = [];
let current = 0;

function extractId(url) {
  if (!url) return null;
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

function render() {
  const book = document.getElementById("book");
  const label = document.getElementById("label");
  if (!pages.length) {
    book.innerHTML = '<p style="text-align:center; padding:60px; color:#aaa;">Альбом порожній.<br>Додай сторінки в адмінці.</p>';
    label.textContent = "";
    return;
  }

  const p = pages[current];
  const fileId = extractId(p.src);
  const img = fileId 
    ? `<img src="https://drive.google.com/thumbnail?id=${fileId}&sz=w800" alt="${p.title}">`
    : `<div style="width:180px;height:240px;background:#ddd;display:flex;align-items:center;justify-content:center;border-radius:4px;">Немає фото</div>`;

  book.innerHTML = `
    <div class="page-card">
      ${img}
      <div>
        <h2 style="margin:0 0 8px;">${p.title || "Без назви"}</h2>
        <p style="margin:0; color:#666; font-style:italic;">${p.series || ""}</p>
        <p style="margin:4px 0 0; font-size:14px;">Косплеєр: ${p.cosplayer || "—"}</p>
        <div style="margin-top:12px;">${(p.tags || []).map(t => `<span style="background:#f3a8c3; color:#3a1630; padding:2px 8px; border-radius:12px; font-size:12px; margin-right:4px;">${t}</span>`).join("")}</div>
      </div>
    </div>
  `;
  label.textContent = `${current + 1} / ${pages.length}`;
}

document.getElementById("prev").onclick = () => { if (current > 0) { current--; render(); } };
document.getElementById("next").onclick = () => { if (current < pages.length - 1) { current++; render(); } };

async function load() {
  try {
    const snap = await getDoc(doc(db, "settings", "album"));
    if (snap.exists()) {
      const data = snap.data();
      document.getElementById("albumTitle").textContent = data.title || "Альбом";
      pages = data.pages || [];
    }
  } catch (err) {
    console.error(err);
  }
  render();
}

load();
</script>
</body>
</html>
